# embassy-net-wiznet from embassy git main with PicoZorro's additions; see
# CHANGELOG.md. The embassy dependencies resolve through the workspace's
# [patch.crates-io].
[package]
name = "embassy-net-wiznet"
version = "0.3.0"
description = "embassy-net driver for WIZnet SPI Ethernet chips"
keywords = ["embedded", "embassy-net", "embedded-hal-async", "ethernet", "async"]
categories = ["embedded", "hardware-support", "no-std", "network-programming", "asynchronous"]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-net-wiznet"

[dependencies]
embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0" }
embassy-net-driver-channel = { version = "0.4.0" }
embassy-time = { version = "0.5.1" }
embassy-futures = { version = "0.1.2" }
defmt = { version = "1.0.1", optional = true }

[features]
defmt = ["dep:defmt", "embassy-net-driver-channel/defmt"]
